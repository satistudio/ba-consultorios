name: Verificar vista previa

on:
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar páginas de la vista previa
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          sleep 150
          SUB=$(echo "$RAMA" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
          BASE="https://$SUB.ba-consultorios-3da.pages.dev"
          # main no tiene alias de rama: se verifica el dominio publicado.
          if [ "$RAMA" = "main" ]; then BASE="https://baconsultoriosmedicos.com.ar"; fi
          for p in / /especialidades/ /especialidades/ginecologia/ /precios/ /turnos/ /estudios/ /contacto/ /sitemap.xml; do
            echo "== $BASE$p"
            curl -sS -o body.html -w "status=%{http_code} redirect=%{redirect_url}\n" "$BASE$p"
            grep -o '<title>[^<]*' body.html | head -1 || true
            grep -o '<h1[^>]*>[^<]*' body.html | head -1 || true
            head -c 300 body.html; echo
          done
          echo "== ¿AgendaPro deja embeber la reserva por servicio?"
          curl -sS -I -L "https://baconsultorios.site.agendapro.com/ar/sucursal/9099?services_id=682555" | grep -i -E "^(HTTP|x-frame|content-security|location)" || true
          echo "== $BASE/api/disponibilidad"
          curl -sS "$BASE/api/disponibilidad" | head -c 900; echo
          echo "DIAS $(curl -sS "$BASE/api/disponibilidad?item=ginecologia&dias=1" | jq -c '[.item.error, (.item.dias[] | [.date,.label,(.times|length),.times[0]])]')"
          echo "DIAS $(curl -sS "$BASE/api/disponibilidad?item=eco-renal&dias=1" | jq -c '[.item.error, (.item.dias[] | [.date,.label,(.times|length),.times[0]])]')"
          echo "== 404 y cabeceras"
          curl -sS -o /dev/null -w "ruta-inexistente status=%{http_code}\n" "$BASE/no-existe-esta-pagina/"
          curl -sSI "$BASE/" | grep -iE "^(x-frame|x-content|referrer|permissions)" || true
          curl -sSI "$BASE/fonts/montserrat-latin-wght-normal.woff2" | grep -iE "^(http|cache-control|content-type)" || true
          curl -sSI "$BASE/og-ba.jpg" | grep -iE "^http" || true
          echo "RESENAS $(curl -sS "$BASE/api/resenas" | head -c 300)"
          echo "GEO $(curl -sS -A 'BA-auditoria/1.0' 'https://nominatim.openstreetmap.org/search?format=json&limit=3&q=Almafuerte+3558,+San+Justo,+Buenos+Aires,+Argentina' | jq -c '[.[] | [.lat,.lon,.display_name]]')"
          for it in $(grep -o 'id: "[a-z0-9-]*"' src/turnos/catalogo.ts | cut -d'"' -f2); do
            echo "ITEM $it $(curl -sS "$BASE/api/disponibilidad?item=$it" | jq -c '[.item.status,.item.dayLabel,.item.count]')"
          done

      - name: Comprobar redirección del pages.dev viejo
        run: |
          # ba-consultorios.pages.dev (cuenta vieja) debe responder 301 al dominio real,
          # también para Googlebot: es lo que pide el Cambio de dirección de Search Console.
          GOOGLEBOT="Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.8010.52 Mobile Safari/537.36 (compatible; Google-InspectionTool/1.0)"
          for ua in "curl" "$GOOGLEBOT"; do
            for u in https://ba-consultorios.pages.dev/ http://ba-consultorios.pages.dev/ https://www.ba-consultorios.pages.dev/; do
              echo "== $u ($ua)"
              curl -sS -A "$ua" -o body.html -D headers.txt -w "status=%{http_code} redirect=%{redirect_url}\n" "$u" || true
              grep -i -E "^(location|cf-ray|server|cache-control|cf-cache-status):" headers.txt || true
              grep -o '<title>[^<]*' body.html | head -1 || true
            done
          done
          echo "== IPs"; getent ahosts ba-consultorios.pages.dev | awk '{print $1}' | sort -u
