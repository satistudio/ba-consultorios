name: Resumen diario por Telegram

# Todos los días a las 23:13 hora argentina (02:13 UTC) manda a Rocío y
# Tatiana el resumen de reservas online, confirmaciones y toques a WhatsApp.
# Necesita el secreto AVISOS_SECRET en GitHub (Settings > Secrets and
# variables > Actions), el mismo valor que en Cloudflare.
# GitHub atrasa los cron (llegó a correr 3-4 h tarde). No importa: la web
# resume siempre el día argentino que terminó (diaACerrar en _lib/avisos.ts).
# Se sacó de las 00:00 UTC porque es la hora en que GitHub más se atrasa.

on:
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:

jobs:
  resumen:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir el resumen a la web
        env:
          AVISOS_SECRET: ${{ secrets.AVISOS_SECRET }}
        run: |
          if [ -z "$AVISOS_SECRET" ]; then echo "Falta el secreto AVISOS_SECRET"; exit 1; fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $AVISOS_SECRET" \
            https://baconsultoriosmedicos.com.ar/api/resumen-whatsapp
